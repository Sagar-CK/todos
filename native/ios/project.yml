name: Todos
options:
  bundleIdPrefix: __BUNDLE_ID__
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "__DEVELOPMENT_TEAM__"
    MARKETING_VERSION: '__VERSION__'
    CURRENT_PROJECT_VERSION: 1
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  Todos:
    type: application
    platform: iOS
    sources:
      - path: TodosApp.swift
      - path: ../Shared
      - path: Resources/web
        type: folder
        buildPhase: resources
      - path: Resources/Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Todos
        CFBundleURLTypes:
          - CFBundleURLName: __BUNDLE_ID__.auth
            CFBundleURLSchemes: [__URL_SCHEME__]
        UILaunchScreen: {}
        KeychainAccessGroup: $(AppIdentifierPrefix)__BUNDLE_ID__.shared
    entitlements:
      path: Todos.entitlements
      properties:
        com.apple.security.application-groups: [group.__BUNDLE_ID__]
        keychain-access-groups: [$(AppIdentifierPrefix)__BUNDLE_ID__.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: __BUNDLE_ID__
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - target: TodosWidget
  TodosWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: ../Shared
      - path: Resources/Geist.ttf
        buildPhase: resources
      - path: Resources/Geist-OFL.txt
        buildPhase: resources
    info:
      path: WidgetInfo.plist
      properties:
        CFBundleDisplayName: Todos
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        KeychainAccessGroup: $(AppIdentifierPrefix)__BUNDLE_ID__.shared
        UIAppFonts: [Geist.ttf]
    entitlements:
      path: TodosWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.__BUNDLE_ID__]
        keychain-access-groups: [$(AppIdentifierPrefix)__BUNDLE_ID__.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: __BUNDLE_ID__.widget
        APPLICATION_EXTENSION_API_ONLY: YES
schemes:
  Todos:
    build:
      targets:
        Todos: all
        TodosWidget: all
